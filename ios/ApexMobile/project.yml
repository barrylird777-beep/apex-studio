name: ApexMobile
options:
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 16.4
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.apexstudio.mobile
    SUPPORTS_MACCATALYST: false
    CODE_SIGN_STYLE: Automatic
targets:
  ApexMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        NSLocalNetworkUsageDescription: "Apex uses your local network to connect to nearby authorized Apex devices, including when cellular service is unavailable."
        NSBonjourServices:
          - _apex-fabric._tcp
        BGTaskSchedulerPermittedIdentifiers:
          - com.apex.studio.network.refresh
    dependencies:
      - framework: Frameworks/llama.xcframework
        embed: true
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        INFOPLIST_KEY_CFBundleDisplayName: Apex Mobile
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
