services:
  research-ui:
    build: ./research_ui
    ports: ["5173:5173"]
    environment:
      VITE_RESEARCH_API: http://localhost:8000/api
    depends_on: [research-api]
  research-api:
    build: ./research_backend
    env_file: ./research_backend/.env
    ports: ["8000:8000"]
    depends_on: [postgres,redis,elasticsearch]
    volumes: ["research_documents:/data/documents"]
  research-beat:
    build: ./research_backend
    env_file: ./research_backend/.env
    command: celery -A app.tasks.celery beat --loglevel=INFO
    depends_on: [redis,postgres]

  research-worker:
    build: ./research_backend
    env_file: ./research_backend/.env
    command: celery -A app.tasks.celery worker --loglevel=INFO
    depends_on: [postgres,redis]
    volumes: ["research_documents:/data/documents"]
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: apex_research
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: change-me
    volumes: ["research_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: ["research_es:/usr/share/elasticsearch/data"]
volumes:
  research_pg:
  research_es:
  research_documents:
