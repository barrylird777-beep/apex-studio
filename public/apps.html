<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Apex canonical application trajectory"><title>Apex Trajectory</title><style>body{margin:0;background:#07090d;color:#eef2f7;font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:28px 16px}header{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8e99aa;font-weight:800}h1{margin:5px 0;font-size:34px;letter-spacing:-.04em}a{color:#dce8ff;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.card{border:1px solid #2b323e;border-radius:18px;background:#10141b;padding:17px;box-shadow:0 14px 35px #0004}.topline{display:flex;justify-content:space-between;gap:10px;align-items:start}.name{font-size:19px;font-weight:850}.role{color:#8f99a8;margin:4px 0 14px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;border:1px solid #343d4b;font-size:11px;color:#b8c2d0}.live{color:#9fe3b1}.degraded{color:#ffd27a}.dead{color:#ff9b9b}.launch{display:inline-block;margin-top:12px;padding:10px 13px;border:1px solid #3c4656;border-radius:10px;background:#181e28}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 16px}.metric{border:1px solid #2b323e;border-radius:14px;padding:12px;background:#0d1117}.metric b{display:block;font-size:23px}.muted{color:#8f99a8}.error{color:#ff9b9b;min-height:20px}@media(max-width:620px){h1{font-size:28px}.summary{grid-template-columns:1fr 1fr}.summary .metric:last-child{grid-column:1/-1}}</style></head><body><main><header><div><div class="eyebrow">Apex control surface</div><h1>Application Trajectory</h1><div class="muted">One launch map for the six canonical applications and their live runtime state.</div></div><a class="launch" href="/">Apex Studio</a></header><section class="summary"><div class="metric"><b id="count">—</b><span class="muted">canonical apps</span></div><div class="metric"><b id="healthy">—</b><span class="muted">runtime healthy</span></div><div class="metric"><b id="checked">—</b><span class="muted">last checked</span></div></section><div id="error" class="error"></div><section id="apps" class="grid"><div class="card">Loading canonical application trajectory…</div></section></main><script>const $=id=>document.getElementById(id);function stateOf(s){const v=String(s?.status||s?.state||"unknown").toLowerCase();return /ok|ready|runtime/.test(v)?"live":/degrad|warn/.test(v)?"degraded":"dead"}async function load(){try{const r=await fetch("/api/canon/apps",{headers:{accept:"application/json"}});const data=await r.json();if(!r.ok)throw new Error(data.error||"HTTP "+r.status);const apps=Array.isArray(data.apps)?data.apps:[];$("count").textContent=apps.length;const results=await Promise.all(apps.map(async app=>{try{const sr=await fetch("/api/canon/apps/"+encodeURIComponent(app.id)+"/status",{headers:{accept:"application/json"}});const sd=await sr.json();return{app,status:sd,state:sr.ok?stateOf(sd):"dead"}}catch(error){return{app,status:{error:error.message},state:"dead"}}}));$("healthy").textContent=results.filter(x=>x.state==="live").length+"/"+results.length;$("checked").textContent=new Date().toLocaleTimeString();$("apps").replaceChildren(...results.map(({app,status,state})=>{const card=document.createElement("article");card.className="card";const top=document.createElement("div");top.className="topline";const name=document.createElement("div");name.className="name";name.textContent=app.name;const pill=document.createElement("span");pill.className="pill "+state;pill.textContent=state;top.append(name,pill);const role=document.createElement("div");role.className="role";role.textContent=app.role;const detail=document.createElement("div");detail.className="muted";detail.textContent=status.error||("Runtime status: "+String(status.status||status.state||"available"));const link=document.createElement("a");link.className="launch";link.href=app.entry;link.textContent="Launch app";card.append(top,role,detail,link);return card}));$("error").textContent=""}catch(error){$("error").textContent="Trajectory registry unavailable: "+error.message}}load();setInterval(load,30000);</script></body></html>
