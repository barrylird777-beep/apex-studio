<<script>
// Browser-Native Cinematic Speech Engine
document.getElementById('synth-button').addEventListener('click', async () => {
    const textInput = document.getElementById('bard-text').value;
    if (!textInput) return alert('Please enter some text to speak.');

    if (!('speechSynthesis' in window)) {
        alert('Speech synthesis is not supported on this browser.');
        return;
    }

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(textInput);
    
    const voices = window.speechSynthesis.getVoices();
    const preferredVoice = voices.find(v => v.lang.includes('en') && (v.name.includes('Natural') || v.name.includes('Neural') || v.name.includes('Google') || v.name.includes('Daniel')));
    if (preferredVoice) {
        utterance.voice = preferredVoice;
    }

    utterance.rate = 0.95; 
    utterance.pitch = 0.9;  

    window.speechSynthesis.speak(utterance);
});
</script>
