<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Studio | Biblical Series Production</title>
    <style>
        :root {
            --bg-base: #0a0a0f;
            --surface: #13141c;
            --surface-hover: #1c1e29;
            --brand: #c6a87c;
            --brand-glow: rgba(198, 168, 124, 0.4);
            --text-main: #f5f5f5;
            --text-muted: #8b8d98;
            --border: #2a2d3d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar layout */
        .sidebar { width: 300px; background: var(--surface); border-right: 1px solid var(--border); padding: 2rem 1.5rem; display: flex; flex-direction: column; gap: 2rem; overflow-y: auto; }
        .brand-title { font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; color: var(--brand); text-transform: uppercase; }
        .brand-subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        .main-content { flex: 1; padding: 2rem; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        @media (max-width: 1200px) { .main-content { grid-template-columns: 1fr; } }
        
        /* Form Controls */
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
        label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
        select, input, textarea { width: 100%; background: var(--bg-base); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; color: var(--text-main); font-size: 0.9rem; transition: border-color 0.2s; outline: none; }
        select:focus, input:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 10px var(--brand-glow); }
        textarea { height: 120px; resize: vertical; }
        
        button { background: var(--brand); color: #000; border: none; border-radius: 6px; padding: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 0.5rem; }
        button:hover { background: #dcc198; box-shadow: 0 0 15px var(--brand-glow); transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        .btn-secondary { background: transparent; border: 1px solid var(--brand); color: var(--brand); }
        .btn-secondary:hover { background: rgba(198, 168, 124, 0.1); box-shadow: none; }

        /* Panels */
        .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; display: flex; flex-direction: column; }
        .panel h2 { font-size: 1.2rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
        
        .output-container { background: var(--bg-base); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; flex-grow: 1; overflow-y: auto; font-size: 0.95rem; line-height: 1.6; color: #d1d5db; position: relative; }
        .image-preview { width: 100%; height: auto; border-radius: 4px; aspect-ratio: 16/9; object-fit: cover; background: #000; display: flex; justify-content: center; align-items: center; }
        .image-preview img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
        
        .toolbar { display: flex; gap: 1rem; margin-top: 1rem; }
        .loader { display: none; color: var(--brand); font-style: italic; font-size: 0.9rem; }
    </style>
</head>
<body>

    <!-- SIDEBAR: Master Controls -->
    <div class="sidebar">
        <div>
            <div class="brand-title">Apex Studio</div>
            <div class="brand-subtitle">Series Production Deck</div>
        </div>

        <div>
            <h3 style="font-size: 0.9rem; margin-bottom: 1rem; color: var(--text-main); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem;">Project Parameters</h3>
            
            <div class="input-group">
                <label>Biblical Era / Act</label>
                <select id="projEra">
                    <option value="Genesis: The Dawn of Creation and the Fall">Act I: Genesis & Dawn</option>
                    <option value="Exodus: The Plagues, the Sea, and Sinai">Act II: Exodus & Liberation</option>
                    <option value="Kings: The rise and catastrophic fall of the Israelite monarchy">Act III: Kings & Prophets</option>
                    <option value="Gospels: The incarnation, ministry, and crucifixion of Christ">Act IV: The Gospels</option>
                    <option value="Revelation: The apocalyptic consummation of all things">Act V: Revelation</option>
                </select>
            </div>

            <div class="input-group">
                <label>Pacing & Tone</label>
                <select id="projPacing">
                    <option value="Slow, awe-inspiring, and profoundly reverent">Reverent & Awe-Inspiring</option>
                    <option value="Fast, intense, chaotic, and terrifying">Intense & Terrifying</option>
                    <option value="Melancholic, sorrowful, and deeply emotional">Sorrowful & Emotional</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Specific Scene Details</label>
                <textarea id="projDetails" placeholder="E.g., Focus on the sheer scale of the Red Sea parting, the fear of the Israelites, and the thunder of the water..."></textarea>
            </div>

            <button onclick="generateScript()">1. Draft Script</button>
        </div>
    </div>

    <!-- MAIN CONTENT: Output & Generation -->
    <div class="main-content">
        
        <!-- SCRIPT PANEL -->
        <div class="panel">
            <h2>
                <span>Script & Voiceover</span>
                <span id="scriptLoader" class="loader">Writing...</span>
            </h2>
            <div class="output-container" id="scriptOutput">
                <span style="color: var(--text-muted);">Adjust parameters in the sidebar and click 'Draft Script' to begin. Output will be formatted for video production.</span>
            </div>
            <div class="toolbar">
                <button class="btn-secondary" onclick="copyText('scriptOutput')" style="flex:1;">Copy Script</button>
            </div>

            <div style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1.5rem;">
                <h3 style="font-size: 0.9rem; margin-bottom: 1rem;">Audio Synthesizer</h3>
                <div class="input-group">
                    <textarea id="audioInput" style="height: 80px;" placeholder="Paste the [NARRATOR] lines here to generate voiceover..."></textarea>
                </div>
                <button onclick="generateAudio()">2. Synthesize Voice</button>
                <div id="audioLoader" class="loader" style="margin-top: 0.5rem;">Rendering Audio...</div>
                <div id="audioOutput" style="margin-top: 1rem;"></div>
            </div>
        </div>

        <!-- VISUAL FORGE PANEL -->
        <div class="panel">
            <h2>
                <span>Storyboard & Visuals</span>
                <span id="visionLoader" class="loader">Rendering...</span>
            </h2>
            
            <div class="input-group">
                <label>Shot Framing</label>
                <select id="visShot">
                    <option value="Sweeping extreme wide drone shot, epic scale">Extreme Wide Shot (Epic Scale)</option>
                    <option value="Medium tracking shot, focusing on characters">Medium Shot (Character Focus)</option>
                    <option value="Extreme close up, hyper-detailed texture">Extreme Close-Up (Intense Detail)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Lighting & Atmosphere</label>
                <select id="visLighting">
                    <option value="God-rays piercing through dust, dramatic chiaroscuro">Divine / God-Rays</option>
                    <option value="Harsh, gritty, stormy, dark high-contrast">Gritty & Stormy</option>
                    <option value="Golden hour, warm, peaceful and sweeping">Warm & Peaceful (Golden Hour)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Scene Description (From Script)</label>
                <textarea id="visScene" style="height: 60px;" placeholder="Paste the [VISUAL] block from your script here..."></textarea>
            </div>

            <button onclick="generateVision()" style="margin-bottom: 1.5rem;">3. Render Frame</button>
            
            <div class="image-preview" id="visionOutput">
                <span style="color: var(--text-muted); font-size: 0.85rem;">16:9 Render Canvas</span>
            </div>
        </div>

    </div>

    <script>
        // API Calls
        async function generateScript() {
            const era = document.getElementById('projEra').value;
            const pacing = document.getElementById('projPacing').value;
            const details = document.getElementById('projDetails').value;
            const output = document.getElementById('scriptOutput');
            const loader = document.getElementById('scriptLoader');

            loader.style.display = 'inline';
            output.innerHTML = '';

            try {
                const res = await fetch('/api/oracle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ era, theme: "Biblical Epic Documentary", pacing, details })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                output.innerText = data.result;
            } catch (err) {
                output.innerHTML = `<span style="color: #ff4444;">Error: ${err.message}</span>`;
            } finally {
                loader.style.display = 'none';
            }
        }

        async function generateVision() {
            const scene = document.getElementById('visScene').value;
            const shotType = document.getElementById('visShot').value;
            const lighting = document.getElementById('visLighting').value;
            const output = document.getElementById('visionOutput');
            const loader = document.getElementById('visionLoader');

            if (!scene) return alert("Please enter a scene description first.");

            loader.style.display = 'inline';
            output.innerHTML = '';

            try {
                const res = await fetch('/api/forge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scene, shotType, lighting, mood: "epic historical" })
                });
                if (!res.ok) throw new Error('Render failed');
                const blob = await res.blob();
                output.innerHTML = `<img src="${URL.createObjectURL(blob)}" alt="Render">`;
            } catch (err) {
                output.innerHTML = `<span style="color: #ff4444; font-size: 0.85rem;">Error: ${err.message}</span>`;
            } finally {
                loader.style.display = 'none';
            }
        }

        async function generateAudio() {
            const text = document.getElementById('audioInput').value;
            const output = document.getElementById('audioOutput');
            const loader = document.getElementById('audioLoader');

            if (!text) return alert("Please paste narrator text first.");

            loader.style.display = 'block';
            output.innerHTML = '';

            try {
                const res = await fetch('/api/bard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (!res.ok) throw new Error('Audio failed');
                const blob = await res.blob();
                output.innerHTML = `<audio controls style="width: 100%;"><source src="${URL.createObjectURL(blob)}" type="audio/flac"></audio>`;
            } catch (err) {
                output.innerHTML = `<span style="color: #ff4444; font-size: 0.85rem;">Error: ${err.message}</span>`;
            } finally {
                loader.style.display = 'none';
            }
        }

        function copyText(elementId) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => alert('Script copied to clipboard!'));
        }
    </script>
</body>
</html>
