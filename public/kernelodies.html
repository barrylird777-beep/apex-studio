<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kernelodies · Apex</title><style>body{margin:0;background:#080a0f;color:#eef2f7;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:34px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{padding:18px;border:1px solid #303640;border-radius:16px;background:#10141b}input,textarea,button{font:inherit;border-radius:9px;padding:9px 11px;border:1px solid #46505f;background:#171d27;color:#fff}button{cursor:pointer}input,textarea{width:100%;box-sizing:border-box;margin:5px 0 9px}pre{white-space:pre-wrap;word-break:break-word;color:#cbd5e1}a{color:#9cc8ff}.track{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid #303640;border-radius:10px;margin-top:8px}.track strong{display:block}.track span{display:block;opacity:.8}</style></head><body><main><div>APEX CANONICAL APP</div><h1>Kernelodies</h1><p>Music, sound, audio creation and audio identity using Apex's existing music contracts.</p><div class="grid"><section class="card"><h2>Track Forge</h2><label>Title<input id="title" value="Apex Theme"></label><label>Prompt<textarea id="prompt" rows="4">cinematic dark-fantasy anime score, sacred atmosphere</textarea></label><button id="add">Create track concept</button><div id="tracks" aria-live="polite"></div></section><section class="card"><h2>Runtime</h2><pre id="status">Checking…</pre></section></div><p><a href="/">Apex Studio</a> · <a href="/api/canon/apps">canonical six registry</a></p></main><script>const $=id=>document.getElementById(id);let tracks=[];function render(){const root=$("tracks");root.replaceChildren(...tracks.map(t=>{const box=document.createElement("div");box.className="track";const title=document.createElement("strong");title.textContent=t.title;const prompt=document.createElement("span");prompt.textContent=t.prompt;box.append(title,prompt);return box}))}$("add").onclick=()=>{const title=$("title").value.trim()||"Untitled",prompt=$("prompt").value.trim();if(!prompt)return;tracks.push({id:"track-"+crypto.randomUUID(),title,prompt,kind:"music-track",provenance:{source:"Kernelodies",status:"concept"}});render()};async function status(){try{const r=await fetch("/api/canon/apps/kernelodies/status");if(!r.ok)throw new Error("HTTP "+r.status);$("status").textContent=JSON.stringify(await r.json(),null,2)}catch(e){$("status").textContent="Runtime unavailable: "+e.message}}render();status();</script></body></html>
