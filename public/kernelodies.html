<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kernelodies · Apex</title><style>body{margin:0;background:#080a0f;color:#eef2f7;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:34px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{padding:18px;border:1px solid #303640;border-radius:16px;background:#10141b}input,textarea,button,select{font:inherit;border-radius:9px;padding:9px 11px;border:1px solid #46505f;background:#171d27;color:#fff}button{cursor:pointer}input,textarea{width:100%;box-sizing:border-box;margin:5px 0 9px}pre{white-space:pre-wrap;word-break:break-word;color:#cbd5e1}a{color:#9cc8ff}.track{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid #303640;border-radius:10px;margin-top:8px}.kl-controls{display:grid;grid-template-columns:2fr 1fr;gap:10px}.kl-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.kl-tag{font-size:12px;padding:4px 7px}.kl-track-meta{font-size:13px;opacity:.8}.track audio{width:100%;max-width:100%}.track[hidden]{display:none}.track strong{display:block}@media(max-width:600px){.kl-controls{grid-template-columns:1fr}.track{flex-direction:column}}.track span{display:block;opacity:.8}</style></head><body><main><div>APEX CANONICAL APP</div><h1>Kernelodies</h1><p>Music, sound, audio creation and audio identity using Apex's existing music contracts.</p><div class="grid"><section class="card"><h2>Track Forge</h2><label>Content domain<select id="content-domain"><option value="bible">Bible</option><option value="korn">Jesus Freaks · 432 Hz only</option><option value="original">Original</option></select></label><p id="tuning-note">Bible content domain.</p><label>Title<input id="title" value="Apex Theme"></label><label>Prompt<textarea id="prompt" rows="4">cinematic dark-fantasy anime score, sacred atmosphere</textarea></label><button id="add">Create track concept</button><div id="tracks" aria-live="polite"></div></section><section class="card"><h2>Runtime</h2><pre id="status">Checking…</pre></section><section class="card" id="kernelodies-library"></section></div><script src="/kernelodies-library.js"></script><p><a href="/">Apex Studio</a> · <a href="/api/canon/apps">canonical six registry</a></p></main><script>const $=id=>document.getElementById(id);let tracks=[];function render(){const root=$("tracks");root.replaceChildren(...tracks.map(t=>{const box=document.createElement("div");box.className="track";const title=document.createElement("strong");title.textContent=t.title;const prompt=document.createElement("span");prompt.textContent=t.prompt;const meta=document.createElement("span");meta.textContent=t.contentDomain==="korn"?"Jesus Freaks · A4 = 432 Hz only":t.contentDomain==="bible"?"Bible":"Original";box.append(title,prompt,meta);return box}))}
function updateTuningNote(){const domain=$("content-domain").value;$("tuning-note").textContent=domain==="korn"?"Jesus Freaks music is locked to A4 = 432 Hz only.":domain==="bible"?"Bible content domain.":"Original content domain."}
$("content-domain").onchange=updateTuningNote;
$("add").onclick=()=>{const title=$("title").value.trim()||"Untitled",prompt=$("prompt").value.trim(),contentDomain=$("content-domain").value;if(!prompt)return;if(contentDomain==="korn"&&/\b440\s*hz\b/i.test(prompt)){$("tuning-note").textContent="Jesus Freaks music must use 432 Hz only; remove the 440 Hz instruction.";return}const tuningHz=contentDomain==="korn"?432:null;const finalPrompt=tuningHz?prompt+" Tuning reference: A4 = 432 Hz only; do not use 440 Hz.":prompt;tracks.push({id:"track-"+crypto.randomUUID(),title,prompt:finalPrompt,contentDomain,tuningHz,kind:"music-track",provenance:{source:"Kernelodies",status:"concept"}});render()};async function status(){try{const r=await fetch("/api/canon/apps/kernelodies/status");if(!r.ok)throw new Error("HTTP "+r.status);$("status").textContent=JSON.stringify(await r.json(),null,2)}catch(e){$("status").textContent="Runtime unavailable: "+e.message}}render();status();</script></body></html>
