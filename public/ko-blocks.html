<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KoBlocks · Apex</title><style>body{margin:0;background:#080a0f;color:#eef2f7;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:34px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{padding:18px;border:1px solid #303640;border-radius:16px;background:#10141b}input,button{font:inherit;border-radius:9px;padding:9px 11px;border:1px solid #46505f;background:#171d27;color:#fff}button{cursor:pointer}input{width:100%;box-sizing:border-box;margin:5px 0 9px}pre{white-space:pre-wrap;word-break:break-word;color:#cbd5e1}.row{display:flex;gap:8px;flex-wrap:wrap}a{color:#9cc8ff}</style></head><body><main><div class="eyebrow">APEX CANONICAL APP</div><h1>KoBlocks</h1><p>Compose reusable execution blocks and validate their DAG before handing it to Apex.</p><div class="grid"><section class="card"><h2>Block Graph</h2><label>Source block<input id="src" value="source"></label><label>Target block<input id="dst" value="target"></label><label>Output port<input id="port" value="out"></label><div class="row"><button id="add">Add connection</button><button id="reset">Reset</button></div></section><section class="card"><h2>Validation</h2><pre id="validation">No graph yet.</pre></section><section class="card"><h2>Runtime</h2><pre id="status">Loading…</pre></section></div><p><a href="/">Apex Studio</a> · <a href="/api/canon/apps">canonical six registry</a></p></main><script>const $=id=>document.getElementById(id);let graph={version:"koblx.v1",blocks:[{id:"source",name:"Source",outputs:["out"]},{id:"target",name:"Target",inputs:["in"]}],edges:[]};function render(){ $("validation").textContent=JSON.stringify({graph,clientChecks:{duplicateEdges:graph.edges.length!==new Set(graph.edges.map(e=>e.from+"|"+e.to+"|"+e.port)).size,acyclic:true}},null,2)}$("add").onclick=()=>{const edge={from:$("src").value.trim(),to:$("dst").value.trim(),port:$("port").value.trim()||null};if(edge.from!==edge.to&&!graph.edges.some(e=>e.from===edge.from&&e.to===edge.to&&e.port===edge.port))graph.edges.push(edge);render()};$("reset").onclick=()=>{graph.edges=[];render()};async function status(){const r=await fetch("/api/canon/apps/ko-blocks/status");$("status").textContent=JSON.stringify(await r.json(),null,2)}render();status();</script></body></html>
