<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="KoBlocks Apex app"><title>KoBlocks · Apex</title>
<style>body{margin:0;min-height:100vh;background:#080a0f;color:#eef2f7;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1000px;margin:auto;padding:42px 20px}.eyebrow{opacity:.62;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.card{margin-top:20px;padding:22px;border:1px solid #303640;border-radius:16px;background:#10141b}pre{white-space:pre-wrap;word-break:break-word;color:#cbd5e1}button{border:1px solid #46505f;background:#171d27;color:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}a{color:#9cc8ff}</style></head>
<body><main><div class="eyebrow">APEX CANONICAL APP</div><h1>KoBlocks</h1><p>The modular building layer for reusable Apex blocks, composition and validated block graphs.</p><div class="card"><strong>Runtime status</strong><pre id="status">Loading…</pre><button id="refresh">Refresh</button></div><p><a href="/">Apex Studio</a> · <a href="/api/canon/apps">canonical six registry</a></p></main>
<script>const id="ko-blocks";async function refresh(){const e=document.getElementById("status");try{const r=await fetch("/api/canon/apps/"+encodeURIComponent(id)+"/status",{headers:{accept:"application/json"}});e.textContent=JSON.stringify(await r.json(),null,2)}catch(x){e.textContent="Runtime status unavailable: "+x.message}}document.getElementById("refresh").onclick=refresh;refresh();</script></body></html>
