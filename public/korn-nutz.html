<body><main>
<p><a href="/">ApexStudio</a> · <a href="/garden-of-apex.html">GardenOfApex</a></p>
<p class="tag">ApexStudio rating system</p>
<h1>KornNutz</h1>
<p>Rating system for Apex movies and shows.</p>
<div class="card"><h2>System</h2><pre id="status">Loading…</pre></div>
<div class="card"><h2>Rating dimensions</h2><pre id="dimensions">Loading…</pre></div>
</main>
<script>
const status={ratingSystem:"KornNutz",purpose:"rating system for Apex movies and shows",targetTypes:["movie","show"],scale:{min:0,max:10,step:.1},dimensions:["story","characters","visuals","audio","entertainment","rewatchability"]};
document.getElementById("status").textContent=JSON.stringify(status,null,2);
document.getElementById("dimensions").textContent=status.dimensions.map((x,i)=>(i+1)+". "+x).join("\n");
</script>
