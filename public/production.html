<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apex Production Desk</title><style>body{font:14px system-ui;background:#090d14;color:#eee;margin:0}header,main{max-width:1400px;margin:auto;padding:20px}header{border-bottom:1px solid #263142}button{padding:9px 12px;border:1px solid #334155;background:#151e2b;color:#fff;border-radius:8px}button.active{background:#d8b36a;color:#111}.tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.grid{display:grid;grid-template-columns:350px 1fr;gap:16px}.panel{background:#101722;border:1px solid #263142;border-radius:12px;padding:16px}.list{display:grid;gap:8px;max-height:620px;overflow:auto}.row{border:1px solid #263142;border-radius:9px;padding:11px;cursor:pointer}.muted{color:#98a4b6}input,textarea{width:100%;box-sizing:border-box;background:#0a1019;color:#fff;border:1px solid #263142;border-radius:7px;padding:9px;margin:5px 0}textarea{min-height:75px}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;border:1px solid #334155;border-radius:999px;padding:3px 7px;margin:2px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><b>APEX BIBLE STORY STUDIO</b><h1>Production Desk</h1><span class="muted">Characters · Scripture-to-Scene · Call Sheets</span> · <a href="/">Back to Studio</a></header><main><div class="tabs"><button class="active" onclick="showTab('chars',this)">Characters</button><button onclick="showTab('scenes',this)">Scene Breakdown</button><button onclick="showTab('calls',this)">Call Sheets</button></div>
<section id="chars"><div class="grid"><div class="panel"><h2>Characters</h2><input id="cq" placeholder="Search name or story" oninput="loadChars()"><div id="clist" class="list"></div></div><div class="panel"><h2 id="ctitle">New Character</h2><input id="cname" placeholder="Canonical name *"><input id="caliases" placeholder="Aliases, comma separated"><input id="cstories" placeholder="Primary stories, comma separated"><input id="crels" placeholder="Relationships, comma separated"><input id="ctraits" placeholder="Key traits, comma separated"><textarea id="cnotes" placeholder="Notes"></textarea><input id="crefs" placeholder="Scripture references, e.g. Exodus 14:21-31"><div class="actions"><button onclick="saveChar()">Save</button><button id="cdelete" onclick="deleteChar()" class="hidden">Delete</button><button onclick="newChar()">Clear</button></div><div id="cmsg"></div></div></div></section>
<section id="scenes" class="hidden"><div class="grid"><div class="panel"><h2>Saved Scenes</h2><div id="slist" class="list"></div></div><div class="panel"><h2>Scripture-to-Scene</h2><input id="sref" placeholder="Exodus 14:21-31"><textarea id="stext" placeholder="Paste scripture passage or source text"></textarea><button onclick="generateScenes()">Generate Breakdown</button><div id="generated"></div><hr><h3>Editor</h3><input id="sid" type="hidden"><input id="snum" type="number" placeholder="Scene number"><input id="sloc" placeholder="Location"><input id="schars" placeholder="Characters, comma separated"><textarea id="saction" placeholder="Action summary"></textarea><textarea id="sbeat" placeholder="Emotional / spiritual beat"></textarea><textarea id="snotes" placeholder="Production notes"></textarea><div class="actions"><button onclick="saveScene()">Save Scene</button><button onclick="deleteScene()">Delete</button><button onclick="downloadJSON()">Export JSON</button></div><div id="smsg"></div></div></div></section>
<section id="calls" class="hidden"><div class="grid"><div class="panel"><h2>Call Sheets</h2><div id="calllist" class="list"></div></div><div class="panel"><h2>Call Sheet Editor</h2><input id="date" type="date"><input id="locations" placeholder="Locations, comma separated"><input id="cast" placeholder="Characters / cast, comma separated"><input id="crew" placeholder="Crew roles, comma separated"><input id="times" placeholder='{"cast":"06:00","crew":"05:00"}'><textarea id="weather" placeholder="Weather notes"></textarea><textarea id="special" placeholder="Special requirements"></textarea><input id="sceneids" placeholder="Linked scene IDs, comma separated"><div class="actions"><button onclick="buildCall()">Build from linked scenes</button><button onclick="saveCall()">Save Call Sheet</button><button onclick="downloadCallPdf()">Download PDF</button><button onclick="printCall()">Print</button></div><div id="callmsg"></div></div></div></section></main><script>
var A='/api/bible-production',currentChar=null,currentCall=null,scenes=[];
function $(id){return document.getElementById(id)} function csv(v){return v.split(',').map(function(x){return x.trim()}).filter(Boolean)} function esc(v){return String(v||'').replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})}
function api(p,o){o=o||{};o.headers={'content-type':'application/json'};return fetch(A+p,o).then(function(r){return r.json().then(function(x){if(!r.ok)throw Error(x.error||'Request failed');return x})})}
function showTab(id,b){['chars','scenes','calls'].forEach(function(x){$(x).classList.add('hidden')});$(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');if(id==='chars')loadChars();if(id==='scenes')loadScenes();if(id==='calls')loadCalls()}
function loadChars(){api('/characters?q='+encodeURIComponent($('cq').value)).then(function(a){$('clist').innerHTML=a.map(function(x){return '<div class="row" onclick="editChar(\''+x.id+'\')"><b>'+esc(x.canonicalName)+'</b><div class="muted">'+esc(x.primaryStories.join(', '))+'</div><span class="pill">'+esc(x.scriptureReferences.join(' · ')||'No references')+'</span></div>'}).join('')})}
function newChar(){currentChar=null;$('ctitle').textContent='New Character';['cname','caliases','cstories','crels','ctraits','cnotes','crefs'].forEach(function(x){$(x).value=''});$('cdelete').classList.add('hidden')}
function editChar(id){api('/characters/'+id).then(function(x){currentChar=x;$('ctitle').textContent=x.canonicalName;[['cname',x.canonicalName],['caliases',x.aliases.join(', ')],['cstories',x.primaryStories.join(', ')],['crels',x.relationships.join(', ')],['ctraits',x.keyTraits.join(', ')],['cnotes',x.notes],['crefs',x.scriptureReferences.join(', ')]].forEach(function(p){$(p[0]).value=p[1]});$('cdelete').classList.remove('hidden')})}
function saveChar(){var b={canonicalName:$('cname').value,aliases:csv($('caliases').value),primaryStories:csv($('cstories').value),relationships:csv($('crels').value),keyTraits:csv($('ctraits').value),notes:$('cnotes').value,scriptureReferences:csv($('crefs').value)};api(currentChar?'/characters/'+currentChar.id:'/characters',{method:currentChar?'PUT':'POST',body:JSON.stringify(b)}).then(function(){$('cmsg').textContent='Saved';newChar();loadChars()}).catch(function(e){$('cmsg').textContent=e.message})}
function deleteChar(){if(currentChar)api('/characters/'+currentChar.id,{method:'DELETE'}).then(function(){newChar();loadChars()})}
function fillScene(x){$('sid').value=x.id;$('snum').value=x.sceneNumber;$('sref').value=x.scriptureReference;$('sloc').value=x.location;$('schars').value=x.characters.join(', ');$('saction').value=x.actionSummary;$('sbeat').value=x.emotionalBeat;$('snotes').value=x.productionNotes}
function generateScenes(){api('/scenes/generate',{method:'POST',body:JSON.stringify({scriptureReference:$('sref').value,text:$('stext').value})}).then(function(a){$('generated').innerHTML=a.map(function(x){return '<div class="row" onclick="fillScene('+JSON.stringify(x).replace(/"/g,'&quot;')+')"><b>Scene '+x.sceneNumber+'</b><div>'+esc(x.actionSummary.slice(0,180))+'</div><span class="pill">'+esc(x.characters.join(', ')||'Verify characters')+'</span></div>'}).join('')}).catch(function(e){$('smsg').textContent=e.message})}
function saveScene(){var b={id:$('sid').value||undefined,sceneNumber:Number($('snum').value)||1,scriptureReference:$('sref').value,location:$('sloc').value,characters:csv($('schars').value),actionSummary:$('saction').value,emotionalBeat:$('sbeat').value,productionNotes:$('snotes').value};api('/scenes',{method:'POST',body:JSON.stringify(b)}).then(function(x){$('sid').value=x.id;$('smsg').textContent='Saved';loadScenes()}).catch(function(e){$('smsg').textContent=e.message})}
function loadScenes(){api('/scenes').then(function(a){scenes=a;$('slist').innerHTML=a.map(function(x){return '<div class="row" onclick="fillScene('+JSON.stringify(x).replace(/"/g,'&quot;')+')"><b>Scene '+x.sceneNumber+'</b> <span class="pill">'+esc(x.scriptureReference)+'</span><div>'+esc(x.actionSummary)+'</div></div>'}).join('')})}
function deleteScene(){if($('sid').value)api('/scenes/'+$('sid').value,{method:'DELETE'}).then(loadScenes)}
function downloadJSON(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(scenes,null,2)],{type:'application/json'}));a.download='apex-scenes.json';a.click()}
function loadCalls(){api('/call-sheets').then(function(a){$('calllist').innerHTML=a.map(function(x){return '<div class="row" onclick="fillCall('+JSON.stringify(x).replace(/"/g,'&quot;')+')"><b>'+esc(x.shootDate)+'</b><div>'+esc(x.locations.join(', '))+'</div><span class="pill">'+x.sceneIds.length+' scenes</span></div>'}).join('')})}
function fillCall(x){currentCall=x;$('date').value=x.shootDate;$('locations').value=x.locations.join(', ');$('cast').value=x.characters.join(', ');$('crew').value=x.crew.join(', ');$('times').value=JSON.stringify(x.callTimes);$('weather').value=x.weatherNotes;$('special').value=x.specialRequirements;$('sceneids').value=x.sceneIds.join(', ')}
function buildCall(){api('/call-sheets/from-scenes',{method:'POST',body:JSON.stringify({sceneIds:csv($('sceneids').value),shootDate:$('date').value,weatherNotes:$('weather').value,specialRequirements:$('special').value})}).then(fillCall).catch(function(e){$('callmsg').textContent=e.message})} function saveCall(){var b={shootDate:$('date').value,locations:csv($('locations').value),characters:csv($('cast').value),crew:csv($('crew').value),callTimes:JSON.parse($('times').value||'{}'),weatherNotes:$('weather').value,specialRequirements:$('special').value,sceneIds:csv($('sceneids').value)};api(currentCall?'/call-sheets/'+currentCall.id:'/call-sheets',{method:currentCall?'PUT':'POST',body:JSON.stringify(b)}).then(function(x){currentCall=x;$('callmsg').textContent='Saved';loadCalls()}).catch(function(e){$('callmsg').textContent=e.message})}
function downloadCallPdf(){if(!currentCall){$('callmsg').textContent='Select a saved call sheet first';return}window.location=A+'/call-sheets/'+currentCall.id+'/pdf'} function printCall(){window.print()} loadChars();
</script></body></html>
