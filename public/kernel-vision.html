<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KernelVision · Apex</title><style>body{margin:0;background:#080a0f;color:#eef2f7;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:34px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{padding:18px;border:1px solid #303640;border-radius:16px;background:#10141b}input,select,button{font:inherit;border-radius:9px;padding:9px 11px;border:1px solid #46505f;background:#171d27;color:#fff}button{cursor:pointer}input,select{width:100%;box-sizing:border-box;margin:5px 0 9px}pre{white-space:pre-wrap;word-break:break-word;color:#cbd5e1}a{color:#9cc8ff}.stage{aspect-ratio:16/9;background:#05070b;border:1px solid #303640;border-radius:14px;display:grid;place-items:center;color:#8792a3}</style></head><body><main><div class="eyebrow">APEX CANONICAL APP</div><h1>KernelVision</h1><p>KernelVision Theatre presents finished work through the Kornmax cinematic display.</p><div class="grid"><section class="card"><h2>Theatre</h2><div class="stage" id="stage">No finished work selected</div><label>Title<input id="title" value="Finished Work"></label><label>Media URL<input id="url" placeholder="https://…"></label><button id="open">Open in Kornmax</button></section><section class="card"><h2>Session</h2><pre id="session">No session.</pre></section><section class="card"><h2>Runtime</h2><pre id="status">Loading…</pre></section></div><p><a href="/">Apex Studio</a> · <a href="/api/canon/apps">canonical six registry</a></p></main><script>const $=id=>document.getElementById(id);$("open").onclick=()=>{const id="film-"+Date.now();const item={id,title:$("title").value.trim()||"Finished Work",mediaUrl:$("url").value.trim(),kind:"finished-work",status:"ready"};$("stage").textContent=item.mediaUrl?"Kornmax · "+item.title:"Kornmax · "+item.title;$("session").textContent=JSON.stringify({sessionId:"session-"+Date.now(),itemId:id,item,display:"Kornmax",theatre:"KernelVision Theatre",mode:"cinematic"},null,2)};fetch("/api/canon/apps/kernel-vision/status").then(r=>r.json()).then(v=>$("status").textContent=JSON.stringify(v,null,2));</script></body></html>
