<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KernelVision · Apex</title><style>body{margin:0;background:#080a0f;color:#eef2f7;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:34px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{padding:18px;border:1px solid #303640;border-radius:16px;background:#10141b}input,button{font:inherit;border-radius:9px;padding:9px 11px;border:1px solid #46505f;background:#171d27;color:#fff}button{cursor:pointer}input{width:100%;box-sizing:border-box;margin:5px 0 9px}pre{white-space:pre-wrap;word-break:break-word;color:#cbd5e1}a{color:#9cc8ff}.stage{aspect-ratio:16/9;background:#05070b;border:1px solid #303640;border-radius:14px;display:grid;place-items:center;color:#8792a3;padding:12px;box-sizing:border-box;text-align:center}.bad{color:#ff9b9b}</style></head><body><main><div>APEX CANONICAL APP</div><h1>KernelVision</h1><p>KernelVision Theatre presents finished work through the Kornmax cinematic display.</p><div class="grid"><section class="card"><h2>Theatre</h2><div class="stage" id="stage">No finished work selected</div><label>Title<input id="title" value="Finished Work"></label><label>Media URL<input id="url" placeholder="https://…"></label><button id="open">Open in Kornmax</button></section><section class="card"><h2>Session</h2><pre id="session">No session.</pre></section><section class="card"><h2>Runtime</h2><pre id="status">Checking…</pre></section></div><p><a href="/">Apex Studio</a> · <a href="/api/canon/apps">canonical six registry</a></p></main><script>const $=id=>document.getElementById(id);$("open").onclick=()=>{const title=$("title").value.trim()||"Finished Work",mediaUrl=$("url").value.trim();if(mediaUrl&&!/^https?:\/\//i.test(mediaUrl)){ $("stage").textContent="Media URL must use http(s).";$("stage").className="stage bad";return}const id="film-"+crypto.randomUUID();const item={id,title,mediaUrl,kind:"finished-work",status:"ready"};$("stage").className="stage";$("stage").textContent=mediaUrl?"Kornmax · "+title+" · media ready":"Kornmax · "+title+" · no media URL";$("session").textContent=JSON.stringify({sessionId:"session-"+crypto.randomUUID(),itemId:id,item,display:"Kornmax",theatre:"KernelVision Theatre",mode:"cinematic"},null,2)};async function status(){try{const r=await fetch("/api/canon/apps/kernel-vision/status");if(!r.ok)throw new Error("HTTP "+r.status);$("status").textContent=JSON.stringify(await r.json(),null,2)}catch(e){$("status").textContent="Runtime unavailable: "+e.message}}status();</script></body></html>
