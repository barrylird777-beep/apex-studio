<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EngineApex | Apex Studio</title><style>body{margin:0;background:#070708;color:#f6f4ef;font:15px system-ui;line-height:1.6}main{max-width:980px;margin:auto;padding:42px 20px}.tag{color:#e5bb77;font-weight:800;letter-spacing:.12em}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.panel{padding:18px;border:1px solid #25252b;border-radius:18px;background:#101014}.panel{margin-top:12px}.num{font-size:28px;font-weight:900}.muted{color:#96949b;font-size:12px}.row{padding:12px;border:1px solid #25252b;border-radius:12px;margin-top:8px}.score{float:right;font-weight:900;color:#73dfa0}a{color:#fff}</style></head><body><main><p class="tag">APEX STUDIO · DECISION ENGINE</p><h1>EngineApex</h1><p class="muted">Opportunity, growth, business and monetization intelligence owned by Apex Studio. It directs production without becoming a separate system.</p><div class="grid"><div class="card"><div id="state" class="num">—</div><div class="muted">Evidence state</div></div><div class="card"><div id="opp" class="num">0</div><div class="muted">Opportunities</div></div><div class="card"><div id="views" class="num">0</div><div class="muted">Lifetime views</div></div><div class="card"><div id="top" class="num">—</div><div class="muted">Top score</div></div></div><section class="panel"><h2>Studio decision feed</h2><div id="list"></div></section><p><a href="/">Apex Studio</a> · <a href="/shield-apex.html">ShieldApex</a></p></main><script>const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));fetch('/api/engine-apex/snapshot').then(r=>r.json()).then(e=>{$('state').textContent=e.state;$('opp').textContent=e.opportunities.length;$('views').textContent=Number(e.lifetime?.totalViews||0).toLocaleString();$('top').textContent=e.opportunities[0]?(e.opportunities[0].score+'%'):'—';$('list').innerHTML=e.opportunities.map(x=>'<div class="row"><span class="score">'+x.score+'%</span><b>'+esc(x.topic)+'</b><div class="muted">'+x.evidenceVideos+' evidence videos · '+x.avgViews.toFixed(0)+' avg views · '+x.avgRetention.toFixed(1)+'% retention</div></div>').join('')||'<div class="row">No evidence-backed opportunities yet.</div>'}).catch(e=>{$('state').textContent='ERROR';$('list').textContent=e.message})</script></body></html>
