<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KoinKob · Apex</title><style>body{margin:0;background:#080a0f;color:#eef2f7;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:34px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{padding:18px;border:1px solid #303640;border-radius:16px;background:#10141b}input,button{font:inherit;border-radius:9px;padding:9px 11px;border:1px solid #46505f;background:#171d27;color:#fff}button{cursor:pointer}input{width:100%;box-sizing:border-box;margin:5px 0 9px}pre{white-space:pre-wrap;word-break:break-word;color:#cbd5e1}a{color:#9cc8ff}.bad{color:#ff9b9b}</style></head><body><main><div>APEX CANONICAL APP</div><h1>KoinKob</h1><p>Worker economy, barter, market clearing and adversarial market simulation.</p><div class="grid"><section class="card"><h2>Market Lab</h2><label>Workers<input id="workers" type="number" min="2" max="2000" value="100"></label><label>Event<input id="event" value="demand-spike"></label><button id="simulate">Run simulation</button></section><section class="card"><h2>Result</h2><pre id="result">No simulation run.</pre></section><section class="card"><h2>Runtime</h2><pre id="status">Checking…</pre></section></div><p><a href="/">Apex Studio</a> · <a href="/api/canon/apps">canonical six registry</a></p></main><script>const $=id=>document.getElementById(id);let busy=false;$("simulate").onclick=async()=>{if(busy)return;const workerCount=Math.max(2,Math.min(2000,Math.floor(Number($("workers").value)||100)));const event=($("event").value.trim()||"demand-spike").slice(0,120);busy=true;$("simulate").disabled=true;try{const r=await fetch("/api/koin-kob/simulation",{method:"POST",headers:{"content-type":"application/json","accept":"application/json"},body:JSON.stringify({workerCount,events:[{type:event,severity:.5}]})});const data=await r.json();if(!r.ok)throw new Error(data.error||"HTTP "+r.status);$("result").textContent=JSON.stringify(data,null,2)}catch(e){$("result").textContent="Simulation failed: "+e.message;$("result").className="bad"}finally{busy=false;$("simulate").disabled=false}};async function status(){try{const r=await fetch("/api/canon/apps/koin-kob/status");if(!r.ok)throw new Error("HTTP "+r.status);$("status").textContent=JSON.stringify(await r.json(),null,2)}catch(e){$("status").textContent="Runtime unavailable: "+e.message}}status();</script></body></html>
