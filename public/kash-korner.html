<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KashKorner · Apex</title><style>body{margin:0;background:#080a0f;color:#eef2f7;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:34px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.card{padding:18px;border:1px solid #303640;border-radius:16px;background:#10141b}input,button{font:inherit;border-radius:9px;padding:9px 11px;border:1px solid #46505f;background:#171d27;color:#fff}button{cursor:pointer}input{width:100%;box-sizing:border-box;margin:5px 0 9px}pre{white-space:pre-wrap;word-break:break-word;color:#cbd5e1}a{color:#9cc8ff}.metric{font-size:28px;font-weight:700}.bad{color:#ff9b9b}</style></head><body><main><div>APEX CANONICAL APP</div><h1>KashKorner</h1><p>Cash ledger with explicit currency boundaries. Entries in different currencies are never silently added together.</p><div class="grid"><section class="card"><h2>Ledger Lab</h2><label>Entry amount<input id="amount" type="number" step="0.01" value="100"></label><label>Currency<input id="currency" value="USD" maxlength="3"></label><button id="add">Add entry</button><div class="metric" id="balance">USD 0.00</div></section><section class="card"><h2>Ledger</h2><pre id="ledger">[]</pre></section><section class="card"><h2>Runtime</h2><pre id="status">Checking…</pre></section></div><p><a href="/">Apex Studio</a> · <a href="/api/canon/apps">canonical six registry</a></p></main><script>const $=id=>document.getElementById(id);let rows=[];function currency(){return($("currency").value||"USD").trim().toUpperCase()}function render(){const code=currency(),matching=rows.filter(r=>r.currency===code),total=matching.reduce((s,r)=>s+r.amount,0);$("balance").textContent=code+" "+total.toFixed(2)+" · "+matching.length+" "+code+" entries";$("ledger").textContent=JSON.stringify(rows,null,2)}$("add").onclick=()=>{const amount=Number($("amount").value),code=currency();if(!Number.isFinite(amount)||amount===0||!/^[A-Z]{3}$/.test(code)){$("ledger").textContent="Invalid amount or ISO-style 3-letter currency.";return}rows.push({id:crypto.randomUUID(),amount,currency:code,kind:"transaction",source:"manual",createdAt:new Date().toISOString()});render()};$("currency").oninput=render;async function status(){try{const r=await fetch("/api/canon/apps/kash-korner/status");if(!r.ok)throw new Error("HTTP "+r.status);$("status").textContent=JSON.stringify(await r.json(),null,2)}catch(e){$("status").textContent="Runtime unavailable: "+e.message}}render();status();</script></body></html>
