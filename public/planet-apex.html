<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PlanetApeX world builder"><title>PlanetApeX · Apex</title><style>body{margin:0;background:#080a0f;color:#eef2f7;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:34px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{padding:18px;border:1px solid #303640;border-radius:16px;background:#10141b}input,button{font:inherit;border-radius:9px;padding:9px 11px;border:1px solid #46505f;background:#171d27;color:#fff}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}input{width:100%;box-sizing:border-box;margin:5px 0 9px}pre{white-space:pre-wrap;word-break:break-word;color:#cbd5e1}.row{display:flex;gap:8px;flex-wrap:wrap}a{color:#9cc8ff}.ok{color:#9fe3b1}.bad{color:#ff9b9b}</style></head><body><main><div>APEX CANONICAL APP</div><h1>PlanetApeX</h1><p>Build a local planetary model with explicit world, region, and entity relationships.</p><div class="grid"><section class="card"><h2>World Builder</h2><label>Planet ID<input id="pid" value="earth" autocomplete="off"></label><label>Name<input id="pname" value="PlanetApeX" autocomplete="off"></label><div class="row"><button id="world">Create world</button><button id="region" disabled>Add region</button><button id="entity" disabled>Add entity</button></div></section><section class="card"><h2>Runtime</h2><pre id="status">Checking…</pre><button id="refresh">Refresh</button></section><section class="card"><h2>World State</h2><pre id="worldState">No world created.</pre></section></div><p><a href="/">Apex Studio</a> · <a href="/api/canon/apps">canonical six registry</a></p></main><script>const $=id=>document.getElementById(id);let planet=null;function render(){const has=!!planet;$("region").disabled=!has;$("entity").disabled=!has;$("worldState").textContent=has?JSON.stringify(planet,null,2):"No world created."}function addRegion(){const n=planet.regions.length+1;planet.regions.push({id:"region-"+n,name:"Region "+n,type:"region",state:{}});render()}function addEntity(){const n=planet.entities.length+1;planet.entities.push({id:"entity-"+n,kind:"entity",name:"Entity "+n,regionId:planet.regions[0]?.id??null,state:{}});render()}$("world").onclick=()=>{const id=$("pid").value.trim();const name=$("pname").value.trim();if(!id||!name)return;$("pid").value=id;$("pname").value=name;planet={id,name,state:{},regions:[],entities:[],createdAt:new Date().toISOString()};render()};$("region").onclick=addRegion;$("entity").onclick=addEntity;async function refresh(){try{const r=await fetch("/api/canon/apps/planet-apex/status",{headers:{accept:"application/json"}});if(!r.ok)throw new Error("HTTP "+r.status);$("status").textContent=JSON.stringify(await r.json(),null,2)}catch(e){$("status").textContent="Runtime unavailable: "+e.message}}$("refresh").onclick=refresh;render();refresh();</script></body></html>
