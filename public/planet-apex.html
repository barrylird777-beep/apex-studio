<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="PlanetApeX Apex application surface">
<title>PlanetApeX · Apex</title>
<style>
body{margin:0;min-height:100vh;background:#080a0f;color:#f2f4f7;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:960px;margin:auto;padding:48px 22px}a{color:#9cc8ff}.eyebrow{opacity:.65;text-transform:uppercase;letter-spacing:.12em;font-size:12px}
.card{margin-top:24px;padding:24px;border:1px solid #303640;border-radius:16px;background:#10141b}
pre{white-space:pre-wrap;word-break:break-word;color:#cbd5e1}
button{border:1px solid #46505f;background:#171d27;color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}
</style>
</head>
<body><main>
<div class="eyebrow">Apex canonical app</div>
<h1>PlanetApeX</h1>
<p>Planetary/world-level Apex environment.</p>
<div class="card"><strong>Runtime</strong><pre id="status">Loading…</pre><button id="refresh">Refresh</button></div>
<p><a href="/">ApexStudio</a> · <a href="/api/apex/apps">six-app registry</a></p>
</main>
<script>
const appId="planet-apex";
async function refresh(){
 const el=document.getElementById("status");
 try{
   const r=await fetch("/api/canon/apps/"+encodeURIComponent(appId)+"/status",{headers:{accept:"application/json"}});
   const data=await r.json();
   el.textContent=JSON.stringify(data,null,2);
 }catch(e){el.textContent="Runtime status unavailable: "+e.message}
}
document.getElementById("refresh").addEventListener("click",refresh); refresh();
</script>
</body></html>
