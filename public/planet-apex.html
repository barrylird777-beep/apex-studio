<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02050b">
<meta name="description" content="PlanetApeX">
<title>PlanetApeX</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02050b}
body{display:grid;place-items:center;min-height:100svh}
.planet-stage{position:relative;width:min(96vmin,900px);aspect-ratio:1;display:grid;place-items:center;isolation:isolate}
.planet{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:
radial-gradient(ellipse at 31% 22%,rgba(255,255,255,.96) 0,rgba(255,255,255,.48) 2%,rgba(255,255,255,0) 12%),
radial-gradient(ellipse at 28% 26%,#6eb6dc 0%,#2878a8 18%,#0b3d69 42%,#061b3b 66%,#010713 100%);
box-shadow:
inset -44px -28px 95px 38px rgba(0,0,0,.94),
inset 15px 12px 34px rgba(255,255,255,.32),
0 0 24px 2px rgba(74,151,255,.16),
0 0 90px 16px rgba(31,102,191,.12);
transform:translateZ(0)}
.planet:before{content:"";position:absolute;inset:0;border-radius:50%;background:
radial-gradient(ellipse at 34% 31%,rgba(164,219,245,.5),transparent 24%),
radial-gradient(ellipse at 47% 47%,transparent 38%,rgba(1,8,25,.32) 72%,rgba(0,0,0,.9) 100%),
linear-gradient(108deg,rgba(255,255,255,.22),transparent 25%,transparent 61%,rgba(0,0,0,.7) 100%);z-index:3;pointer-events:none}
.land{position:absolute;inset:0;width:100%;height:100%;z-index:1;filter:drop-shadow(0 0 3px rgba(108,186,135,.35))}
.clouds{position:absolute;inset:-1%;width:102%;height:102%;z-index:2;opacity:.42;mix-blend-mode:screen}
.atmosphere{position:absolute;inset:-1.5%;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(130,202,255,.22),0 0 0 2px rgba(78,160,255,.18),0 0 26px 5px rgba(57,143,255,.15);z-index:4}
@media(min-width:700px){.planet-stage{width:min(94vmin,980px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="planet-stage" aria-label="PlanetApeX">
<div class="planet" role="img" aria-label="A large, realistic blue planet with continents, oceans, cloud bands, and a thin atmosphere">
<svg class="land" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
<defs>
<linearGradient id="landColor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6c994"/><stop offset=".36" stop-color="#668e68"/><stop offset=".7" stop-color="#385f4e"/><stop offset="1" stop-color="#203f3c"/></linearGradient>

<clipPath id="globe"><circle cx="500" cy="500" r="499"/></clipPath>

</div>
<div class="atmosphere"></div>
</main>

</html>
