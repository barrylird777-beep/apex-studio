<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02050b">
<title>PlanetApeX</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02050b}
body{display:grid;place-items:center;min-height:100svh}
main{width:100%;height:100%;display:grid;place-items:center}
.planet{width:min(88vmin,760px);height:min(88vmin,760px);position:relative;border-radius:50%;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 28% 22%,#a8e0f4 0,#5ca6d0 9%,#1c689f 27%,#0c3e70 49%,#051a3c 70%,#010610 100%);box-shadow:inset -65px -28px 100px 22px #000e,inset 18px 8px 35px #ffffff52,0 0 24px #378edc35,0 0 85px #2679d02b}
.planet:before{content:"";position:absolute;inset:0;border-radius:50%;z-index:3;background:radial-gradient(ellipse at 27% 24%,#fff5 0,transparent 22%),linear-gradient(105deg,#fff2 0%,transparent 29%,#0000 52%,#000b 100%),radial-gradient(ellipse at 50% 50%,transparent 48%,#0007 77%,#000e 100%);pointer-events:none}
.land{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.clouds{position:absolute;inset:-1%;width:102%;height:102%;z-index:2;opacity:.42;mix-blend-mode:screen}
.atmosphere{position:absolute;inset:-1.1%;border-radius:50%;z-index:4;pointer-events:none;box-shadow:inset 0 0 0 2px #9edaff48,0 0 0 2px #5cb9ff2b,0 0 27px #398eff22}
@media(min-aspect-ratio:1/1){.planet{width:min(88vh,88vw,820px);height:min(88vh,88vw,820px)}}
</style>
</head>
<body>
<main aria-label="PlanetApeX">
<div class="planet" role="img" aria-label="One large realistic blue planet, centered against deep black space">
<svg class="land" viewBox="0 0 1000 1000" aria-hidden="true">

</g></svg>

</div><div class="atmosphere"></div></div>
</main>
</body>
</html>
