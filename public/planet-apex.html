<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PlanetApeX Apex app"><title>PlanetApeX · Apex</title><style>body{margin:0;background:#080a0f;color:#eef2f7;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1100px;margin:auto;padding:34px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{padding:18px;border:1px solid #303640;border-radius:16px;background:#10141b}.eyebrow{opacity:.6;text-transform:uppercase;letter-spacing:.12em;font-size:12px}input,button{font:inherit;border-radius:9px;padding:9px 11px;border:1px solid #46505f;background:#171d27;color:#fff}button{cursor:pointer}input{width:100%;box-sizing:border-box;margin:5px 0 9px}pre{white-space:pre-wrap;word-break:break-word;color:#cbd5e1}.row{display:flex;gap:8px;flex-wrap:wrap}a{color:#9cc8ff}</style></head><body><main><div class="eyebrow">APEX CANONICAL APP</div><h1>PlanetApeX</h1><p>World state, regions, entities and cross-app planetary context.</p><div class="grid"><section class="card"><h2>World Builder</h2><label>Planet ID<input id="pid" value="earth"></label><label>Name<input id="pname" value="PlanetApeX"></label><div class="row"><button id="world">Create local world</button><button id="region">Add region</button><button id="entity">Add entity</button></div></section><section class="card"><h2>Runtime</h2><pre id="status">Loading…</pre><button id="refresh">Refresh</button></section><section class="card"><h2>Local World State</h2><pre id="worldState">No world created.</pre></section></div><p><a href="/">Apex Studio</a> · <a href="/api/canon/apps">canonical six registry</a></p></main><script>let planet=null;const $=id=>document.getElementById(id);async function refresh(){const r=await fetch("/api/canon/apps/planet-apex/status");$("status").textContent=JSON.stringify(await r.json(),null,2)}$("world").onclick=()=>{planet={id:$("pid").value.trim()||"earth",name:$("pname").value.trim()||"PlanetApeX",state:{},regions:[],entities:[],createdAt:new Date().toISOString()};$("worldState").textContent=JSON.stringify(planet,null,2)};$("region").onclick=()=>{if(!planet)return;const id="region-"+(planet.regions.length+1);planet.regions.push({id,name:"Region "+(planet.regions.length+1),type:"region",state:{}});$("worldState").textContent=JSON.stringify(planet,null,2)};$("entity").onclick=()=>{if(!planet)return;const regionId=planet.regions[0]?.id||null;planet.entities.push({id:"entity-"+(planet.entities.length+1),kind:"entity",name:"Entity "+(planet.entities.length+1),regionId,state:{}});$("worldState").textContent=JSON.stringify(planet,null,2)};$("refresh").onclick=refresh;refresh();</script></body></html>
