<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<title>PlanetApeX</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02040a}
body{display:grid;place-items:center;min-height:100svh}
main{width:100%;height:100%;display:grid;place-items:center}
.pa-home-planet{position:relative;width:min(91vmin,820px);height:min(91vmin,820px);border-radius:50%;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 29% 22%,#d4f3ff 0,#8dd4f5 5%,#3b9ed7 17%,#1768a8 38%,#0a376c 62%,#03152f 82%,#010611 100%);box-shadow:inset -75px -32px 105px 24px #000e,inset 20px 12px 42px #ffffff63,0 0 34px #3c9de044,0 0 100px #1d69b52b}
.pa-home-planet:before{content:"";position:absolute;inset:0;z-index:4;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse at 27% 21%,#fff7 0,transparent 20%),linear-gradient(105deg,#fff2 0%,transparent 31%,#0000 51%,#000c 100%),radial-gradient(ellipse at center,transparent 47%,#0007 75%,#000f 100%)}
.pa-home-planet:after{content:"";position:absolute;inset:-1%;z-index:5;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 0 2px #b6eaff5c,0 0 0 2px #4aa9ff2b,0 0 30px #398eff25}
.land,.clouds{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.land{z-index:1}.clouds{z-index:2;opacity:.54;mix-blend-mode:screen}
@media(min-aspect-ratio:1/1){.pa-home-planet{width:min(91vh,91vw,820px);height:min(91vh,91vw,820px)}}
</style>
</head>
<body>
<main aria-label="PlanetApeX">
<div class="pa-home-planet" role="img" aria-label="One large realistic blue planet centered alone against deep black space">
<svg class="land" viewBox="0 0 1000 1000" aria-hidden="true">
<defs>
<clipPath id="globe"><circle cx="500" cy="500" r="498"/></clipPath>
<linearGradient id="landColor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4dba4"/><stop offset=".3" stop-color="#80b77d"/><stop offset=".68" stop-color="#397c62"/><stop offset="1" stop-color="#164b4c"/></linearGradient>
<filter id="terrain"><feTurbulence type="fractalNoise" baseFrequency=".014" numOctaves="4" seed="19"/><feColorMatrix values=".7 0 0 0 .12 0 .9 0 0 .16 0 0 .6 0 .12 0 0 0 .42 0"/></filter>
<linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0fbff"/><stop offset="1" stop-color="#8fc8e4" stop-opacity=".04"/></linearGradient>
</defs>
<g clip-path="url(#globe)">
<g fill="url(#landColor)" stroke="#c6e5b1" stroke-opacity=".32" stroke-width="4">

</g>
<rect width="1000" height="1000" filter="url(#terrain)" opacity=".25" style="mix-blend-mode:soft-light"/>

<path d="M0 832Q225 784 420 847T1000 817V1000H0Z" fill="url(#ice)" opacity=".78"/>
</g></svg>
<svg class="clouds" viewBox="0 0 1000 1000" aria-hidden="true"><defs><filter id="softCloud"><feGaussianBlur stdDeviation="7"/></filter><clipPath id="cloudClip"><circle cx="500" cy="500" r="498"/></clipPath></defs><g clip-path="url(#cloudClip)" fill="none" stroke="#e7f7ff" stroke-linecap="round" filter="url(#softCloud)"><path d="M-80 260C80 204 156 274 256 241S421 218 509 249 686 281 805 226 1008 222 1090 264" stroke-width="25" opacity=".62"/><path d="M-40 347C120 304 214 365 328 337S528 307 621 343 814 373 1030 321" stroke-width="17" opacity=".48"/><path d="M-80 575C84 535 175 600 290 568S487 540 601 575 820 611 1090 550" stroke-width="23" opacity=".48"/><path d="M-40 697C121 657 221 713 343 682S553 660 667 696 855 720 1040 678" stroke-width="15" opacity=".5"/><path d="M145 126C190 180 225 193 270 194M622 151C672 188 701 194 753 184M130 770C190 742 235 746 279 761M683 806C729 773 766 781 811 792" stroke-width="20" opacity=".52"/></g></svg>
</div>
</main>
</body>
</html>
