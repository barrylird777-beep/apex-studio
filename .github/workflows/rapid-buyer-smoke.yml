name: Rapid Buyer Smoke

on:
  push:
    branches: [main]
    paths:
      - 'public/rapid-video.html'
      - 'src/workers/rapid-video-worker.mjs'
      - 'src/payments/stripe-rapid.mjs'
      - 'test/rapid-video-buyer-smoke.test.mjs'
      - 'package.json'
      - '.github/workflows/rapid-buyer-smoke.yml'
  pull_request:
    paths:
      - 'public/rapid-video.html'
      - 'src/workers/rapid-video-worker.mjs'
      - 'src/payments/stripe-rapid.mjs'
      - 'test/rapid-video-buyer-smoke.test.mjs'
      - 'package.json'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Rapid buyer smoke
        run: node --test test/rapid-video-buyer-smoke.test.mjs test/rapid-video.test.mjs
