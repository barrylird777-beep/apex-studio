name: Deploy optional APEX multi-protocol edge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-http3-worker
          command: deploy

      - name: Verify negotiated HTTP/1.1 and HTTP/2
        shell: bash
        run: |
          set -euo pipefail
          url="https://apex-free-http3-edge.tbtristan777.workers.dev/"
          for protocol in http1.1 http2; do
            echo "Checking client-to-edge protocol: $protocol"
            result="$(curl "--$protocol" --silent --show-error --location --max-redirs 5 --retry 5 --retry-all-errors --retry-delay 2 --output /dev/null --write-out '%{http_version} %{http_code}' "$url")"
            version="${result%% *}"
            status="${result##* }"
            echo "Negotiated HTTP version: $version; status: $status"
            if [[ "$protocol" == "http1.1" && "$version" != "1.1" ]]; then
              echo "Expected HTTP/1.1 but negotiated HTTP/$version." >&2
              exit 1
            fi
            if [[ "$protocol" == "http2" && "$version" != "2" ]]; then
              echo "Expected HTTP/2 but negotiated HTTP/$version." >&2
              exit 1
            fi
            if [[ ! "$status" =~ ^[234][0-9][0-9]$ ]]; then
              echo "$protocol edge check failed." >&2
              exit 1
            fi
          done

      - name: Verify negotiated HTTP/3 when client supports it
        shell: bash
        run: |
          set -euo pipefail
          url="https://apex-free-http3-edge.tbtristan777.workers.dev/"
          if curl --version | grep -qi 'HTTP3'; then
            result="$(curl --http3-only --silent --show-error --location --max-redirs 5 --retry 5 --retry-all-errors --retry-delay 2 --output /dev/null --write-out '%{http_version} %{http_code}' "$url")"
            version="${result%% *}"
            status="${result##* }"
            echo "Negotiated HTTP version: $version; status: $status"
            if [[ "$version" != "3" ]]; then
              echo "Expected HTTP/3 but negotiated HTTP/$version." >&2
              exit 1
            fi
            if [[ ! "$status" =~ ^[234][0-9][0-9]$ ]]; then
              echo "HTTP/3 edge check failed." >&2
              exit 1
            fi
            echo "HTTP/3 negotiation verified from this runner."
          else
            echo "HTTP/3 NOT VERIFIED: this runner's curl lacks HTTP/3 support. HTTP/1.1 and HTTP/2 checks do not prove HTTP/3."
          fi
