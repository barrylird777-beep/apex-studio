name: Deploy optional APEX HTTP/3 edge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-http3-worker
          command: deploy

      - name: Smoke-test deployed edge
        shell: bash
        run: |
          set -euo pipefail
          url="https://apex-free-http3-edge.tbtristan777.workers.dev/"
          status="$(curl --silent --show-error --location --max-redirs 5 --retry 5 --retry-all-errors --retry-delay 2 --output /dev/null --write-out '%{http_code}' "$url")"
          echo "APEX edge HTTP status: $status"
          if [[ ! "$status" =~ ^[234][0-9][0-9]$ ]]; then
            echo "Edge smoke test failed; expected an HTTP 2xx, 3xx, or 4xx response, not a transport/server failure." >&2
            exit 1
          fi
          echo "Edge endpoint is reachable. This smoke test does not prove HTTP/3 negotiation."
