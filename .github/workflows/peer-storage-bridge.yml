name: Peer Storage API Bridge
on:
  pull_request:
    paths:
      - "src/core/peer-storage-api-bridge.mjs"
      - "src/core/peer-storage-api-client.mjs"
      - "src/core/peer-content-addressed-store.mjs"
      - "src/core/peer-mesh-cas-adapter.mjs"
      - "src/core/peer-cas-runtime.mjs"
      - "src/core/sovereign-runtime-daemon.mjs"
      - "src/core/apex-pure-store.mjs"
      - "src/core/storage.mjs"
      - "server.mjs"
      - "scripts/run-tests-with-diagnostics.mjs"
      - "test/helpers/test-peer-storage-bridge.mjs"
      - "test/storage-scenes.test.mjs"
      - "test/remote-apex-pure-store.test.mjs"
      - "test/sovereign-pure-wal-bridge.test.mjs"
      - "test/schedule-api.smoke.mjs"
      - "test/peer-storage-api-bridge.test.mjs"
      - "test/peer-content-addressed-store-cache.test.mjs"
      - ".github/workflows/peer-storage-bridge.yml"
  push:
    branches:
      - main
      - "apex/api-peer-runtime-six-app-bridge"
    paths:
      - "src/core/peer-storage-api-bridge.mjs"
      - "src/core/peer-storage-api-client.mjs"
      - "test/peer-storage-api-bridge.test.mjs"
      - ".github/workflows/peer-storage-bridge.yml"
permissions:
  contents: read
jobs:
  bridge-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check integrated runtime modules
        run: >-
          node --check src/core/peer-storage-api-bridge.mjs &&
          node --check src/core/peer-storage-api-client.mjs &&
          node --check src/core/peer-content-addressed-store.mjs &&
          node --check src/core/peer-mesh-cas-adapter.mjs &&
          node --check src/core/peer-cas-runtime.mjs &&
          node --check src/core/sovereign-runtime-daemon.mjs &&
          node --check src/core/apex-pure-store.mjs &&
          node --check src/core/storage.mjs &&
          node --check server.mjs &&
          node --check scripts/run-tests-with-diagnostics.mjs &&
          node --check test/helpers/test-peer-storage-bridge.mjs &&
          node --check test/storage-scenes.test.mjs &&
          node --check test/remote-apex-pure-store.test.mjs &&
          node --check test/sovereign-pure-wal-bridge.test.mjs &&
          node --check test/schedule-api.smoke.mjs
      - name: Test bridge authentication and app isolation
        run: node --test test/peer-storage-api-bridge.test.mjs
      - name: Test bounded verified RAM cache
        run: node --test test/peer-content-addressed-store-cache.test.mjs
