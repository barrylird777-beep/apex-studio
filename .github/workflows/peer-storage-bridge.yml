name: Peer Storage API Bridge
on:
  pull_request:
    paths:
      - ".github/workflows/peer-storage-bridge.yml"
      - "package.json"
      - "package-lock.json"
      - "server.mjs"
      - "scripts/**"
      - "src/core/**"
      - "src/network/**"
      - "test/**"
  push:
    branches:
      - main
      - "apex/api-peer-runtime-six-app-bridge"
    paths:
      - ".github/workflows/peer-storage-bridge.yml"
      - "package.json"
      - "package-lock.json"
      - "server.mjs"
      - "scripts/**"
      - "src/core/**"
      - "src/network/**"
      - "test/**"
permissions:
  contents: read
jobs:
  bridge-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies required by peer transport tests
        run: npm install --no-audit --no-fund
      - name: Syntax-check integrated runtime modules
        run: >-
          node --check src/core/peer-storage-api-bridge.mjs &&
          node --check src/core/peer-storage-api-client.mjs &&
          node --check src/core/local-cas-fast-path.mjs &&
          node --check scripts/benchmark-local-cas-fast-path.mjs &&
          node --check src/core/content-addressed-store.mjs &&
          node --check src/core/namespace-access-tensor.mjs &&
          node --check src/core/peer-content-addressed-store.mjs &&
          node --check src/core/peer-mesh-cas-adapter.mjs &&
          node --check src/core/peer-cas-runtime.mjs &&
          node --check src/core/peer-runtime-controls.mjs &&
          node --check src/core/peer-storage-libp2p-transport.mjs &&
          node --check src/network/sovereign-peer.mjs &&
          node --check src/core/peer-runtime-launch-gates.mjs &&
          node --check src/core/sovereign-runtime-daemon.mjs &&
          node --check src/core/apex-pure-store.mjs &&
          node --check src/core/storage.mjs &&
          node --check server.mjs
      - name: Test local CAS fast path invariants
        run: node --test test/local-cas-fast-path.test.mjs
      - name: Test bridge and peer CAS correctness
        run: node --test test/peer-storage-api-bridge.test.mjs test/peer-content-addressed-store.test.mjs test/peer-content-addressed-store-cache.test.mjs
      - name: Test signed runtime controls and access tensors
        run: node --test test/peer-runtime-controls.test.mjs
      - name: Test challenge-bound hardware-root admission
        run: node --test test/peer-cas-runtime.test.mjs
      - name: Test distributed job lease recovery and fencing
        run: node --test test/peer-mesh-cas-adapter.test.mjs test/namespace-access-tensor.test.mjs
      - name: Test launch gates and runtime wiring
        run: node --test test/peer-runtime-launch-gates.test.mjs test/peer-cas-runtime.test.mjs test/remote-apex-pure-store.test.mjs test/sovereign-app-fabric.test.mjs
      - name: Test peer-only asset storage and API smoke
        run: node --test test/storage-scenes.test.mjs test/storage-stream.test.mjs test/schedule-api.smoke.mjs
      - name: Test coordinator-local CAS remains disabled
        run: node --test test/content-addressed-store.test.mjs
