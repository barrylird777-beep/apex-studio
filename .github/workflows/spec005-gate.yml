name: SPEC-005 gate

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "spec/005-scheduling"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec005-gate:
    name: spec005-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: SPEC-005 sovereign schedule smoke
        run: node --test test/schedule-api.smoke.mjs
