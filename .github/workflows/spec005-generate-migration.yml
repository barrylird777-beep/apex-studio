name: SPEC-005 migration proposal (manual review)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "drizzle/**"
      - "drizzle.config.*"
      - "package.json"
      - ".github/workflows/spec005-generate-migration.yml"

permissions:
  contents: read

concurrency:
  group: spec005-migration-proposal
  cancel-in-progress: true

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Generate migration for review (never commit or push)
        run: npm run db:generate
      - name: Report generated diff
        if: always()
        run: |
          git --no-pager diff --stat -- drizzle
          git --no-pager diff -- drizzle
          echo "This workflow has read-only repository permissions. Generated migrations must be reviewed and committed by a human."
