name: Gemini PR Review
# Advisory reviewer; deterministic gate is separate.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review_gate:
    name: Gemini Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Gemini review gate
        run: |
          echo "Gemini Code Review gate passed."
          echo "The external Gemini reviewer is advisory and cannot block Apex CI."

  advisory_review:
    name: Gemini Advisory Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Prepare review context
        shell: bash
        run: |
          mkdir -p .gemini
          jq -n             --arg repo "${REPOSITORY}"             --arg pr "${PULL_REQUEST_NUMBER}"             '{repository: $repo, pull_request_number: $pr, additional_context: "Apex Studio production codebase. Prioritize correctness, security, worker durability, PostgreSQL queue/lease races, idempotency, CI reliability, and Railway runtime safety. Do not suggest weakening tests or security gates."}'             > .gemini/context.json
        env:
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}

      - name: Run Gemini Advisory Review
        id: gemini
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          workflow_name: gemini-review
          github_pr_number: ${{ github.event.pull_request.number }}
          settings: |-
            {
              "model": {
                "maxSessionTurns": 25
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              }
            }
          extensions: |
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          prompt: "/pr-code-review"
