name: Apex CI
# CI trigger refresh: keep verification attached to the release branch.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  spec-001:
    name: SPEC-001 verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apex_test
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "30000"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apex_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies with registry retries
        run: npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000

      - name: Verify PostgreSQL is ready
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres -d apex_test >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - run: npm run db:generate
      - name: Upload generated Drizzle migration
        uses: actions/upload-artifact@v4
        with:
          name: spec-001-drizzle
          path: drizzle-pg
          if-no-files-found: error

      - run: npm run db:migrate
      - run: npm run build
      - run: npm run smoke:production
      - run: npm test
      - run: npm run verify:migrations
      - run: npm run db:seed

      - name: Start server for SPEC-005 HTTP smoke
        run: |
          set -euo pipefail
          PORT=3001 npm start > /tmp/apex-server.log 2>&1 &
          echo $! > /tmp/apex-server.pid
          for i in {1..45}; do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3001/api/projects >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/apex-server.pid)" 2>/dev/null; then
              cat /tmp/apex-server.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/apex-server.log
          exit 1

      - name: Run SPEC-005 HTTP smoke
        run: BASE_URL=http://127.0.0.1:3001 npm run smoke:005

      - name: Stop SPEC-005 server
        if: always()
        run: |
          if [[ -f /tmp/apex-server.pid ]]; then
            kill "$(cat /tmp/apex-server.pid)" 2>/dev/null || true
          fi

      - run: npx tsx test/spec001.smoke.ts

  network-transfer:
    name: Network transfer verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "30000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies with registry retries
        run: npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000

      - run: npm run test:network

      - name: Rapid live production verification
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          url="https://apex-studio-production.up.railway.app"
          for i in $(seq 1 18); do
            code="$(curl -L -sS -o /tmp/rapid-health.json -w '%{http_code}' --max-time 10 "$url/health" || true)"
            if [ "$code" = "200" ] && grep -q '"ok":true' /tmp/rapid-health.json; then
              echo "Rapid production health is live."
              cat /tmp/rapid-health.json
              break
            fi
            echo "Rapid production attempt $i/18: HTTP $code"
            if [ "$i" = "18" ]; then exit 1; fi
            sleep 10
          done
          curl -fsSL --max-time 20 "$url/rapid-video.html" | grep -q "Apex Rapid Video"
