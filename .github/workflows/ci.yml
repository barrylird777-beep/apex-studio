name: Apex CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install system dependencies (FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install
      - name: Persist regenerated lockfile
        if: matrix.node == '22.x' && github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Synchronize package lockfile"
            git push
          fi
      - run: npm run check
      - name: Execute mesh runtime
        run: npm run apex:run
      - name: Create validation dataset
        run: |
          mkdir -p data/payloads
          printf '%s\n' '{"validation":"remote","source":"github-actions","ok":true}' > data/payloads/sample-target.json
      - name: Clean payload
        run: node scripts/clean-payload.js
      - name: Run test suite
        run: npm test
      - name: Run security gate
        run: npm run security:gate
