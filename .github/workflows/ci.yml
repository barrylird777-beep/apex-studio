name: Apex CI
on:
  push:
    branches: ["**"]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:
concurrency:
  group: apex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CI: true
jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22.x"]') || fromJSON('["22.x","24.x"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - run: npm ci
      - run: npm run check
      - run: npx --yes --package=typescript@5.9.2 tsc --checkJs --noEmit --allowJs
      - name: Create validation dataset
        run: |
          mkdir -p data/payloads
          printf '%s\n' '{"validation":"remote","source":"github-actions","ok":true}' > data/payloads/sample-target.json
      - run: node scripts/clean-payload.js
      - run: npm test
  mesh-smoke:
    name: Mesh smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run apex:run
  security:
    name: Security gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: npm run security:gate
