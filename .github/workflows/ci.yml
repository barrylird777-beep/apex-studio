name: Apex CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: apex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  spec-001:
    name: SPEC-001 verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm install
      - run: npm run db:generate
      - name: Upload generated Drizzle migration
        uses: actions/upload-artifact@v4
        with:
          name: spec-005-drizzle
          path: drizzle
      - run: npm run db:migrate
      - run: npm run build
      - run: npm test
      - run: npm run db:seed
      - run: npx tsx test/spec001.smoke.ts
