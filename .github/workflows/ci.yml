name: Apex CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run check
      - name: Create validation dataset
        run: |
          mkdir -p data/payloads
          printf '%s\n' '{"validation":"remote","source":"github-actions","ok":true}' > data/payloads/sample-target.json
      - name: Clean payload
        run: node scripts/clean-payload.js
      - name: Run test suite
        run: npm test
      - name: Run security gate
        run: npm run security:gate
