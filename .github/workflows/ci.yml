name: Apex CI
# CI trigger refresh: keep verification attached to the release branch.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  spec-001:
    name: Sovereign Pure-WAL verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Install ffmpeg for mastering fallback
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Production smoke
        run: npm run smoke:production
      - name: SIGTERM readiness race
        run: npm run test:sigterm-race
      - name: Deterministic fault simulator
        run: npm run test:deterministic-sim
      - name: Canonical six-app contract
        run: npm run check:canonical
      - name: KernelVision episode smoke
        run: npm run smoke:kernelvision-episode
      - name: Pure-WAL test suite
        run: npm test
      - name: Release audit
        run: npm run apex:release-audit
      - name: Network tests
        run: npm run test:network
      - name: SPEC-005 Pure-WAL schedule smoke
        run: node --test test/schedule-api.smoke.mjs
  network-transfer:
    name: Network transfer verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "30000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies with registry retries
        run: npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=30000

      - run: npm run test:network


  formal-model:
    name: TLA+ bounded sovereign WAL safety model
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download pinned TLA+ model checker
        run: |
          curl --fail --location --retry 3 --retry-delay 2 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o /tmp/tla2tools.jar
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  /tmp/tla2tools.jar" | sha1sum --check -
      - name: Model-check bounded safety invariants
        run: java -cp /tmp/tla2tools.jar tlc2.TLC -config formal/SovereignWalSafety.cfg formal/SovereignWalSafety.tla
