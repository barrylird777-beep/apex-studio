name: Apex CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: apex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  spec-001:
    name: SPEC-001 verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm install
      - run: npm run db:generate
      - name: Upload generated Drizzle migration
        uses: actions/upload-artifact@v4
        with:
          name: spec-005-drizzle
          path: drizzle
      - run: npm run db:migrate
      - run: npm run build
      - run: npm test
      - run: npm run verify:migrations
      - run: npm run db:seed
      - name: Start server for SPEC-005 HTTP smoke
        run: |
          PORT=3001 npm start > /tmp/apex-server.log 2>&1 &
          echo $! > /tmp/apex-server.pid
          for i in {1..30}; do curl -fsS http://localhost:3001/api/projects >/dev/null && exit 0; sleep 1; done
          cat /tmp/apex-server.log
          exit 1
      - name: Run SPEC-005 HTTP smoke
        run: npm run smoke:005
      - name: Stop SPEC-005 server
        if: always()
        run: kill $(cat /tmp/apex-server.pid) 2>/dev/null || true
      - run: npx tsx test/spec001.smoke.ts
