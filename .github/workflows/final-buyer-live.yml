name: Final Buyer Readiness Verification

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live TeeVee buyer path
        run: |
          set -euo pipefail
          url=https://apex-studio-foundation-production.up.railway.app
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/health -w '%{http_code}' --max-time 10 "$url/health" || true)
            echo "health=$code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          test "$code" = "200"
          curl -fsSL --max-time 20 "$url/teevee-buyer.html" -o /tmp/page
          grep -qi "TeeVee" /tmp/page
          code=$(curl -sS -o /tmp/buyer -w '%{http_code}' --max-time 20 "$url/api/teevee/buyer" || true)
          echo "buyer=$code"
          test "$code" = "200"
          grep -q '"product":"TeeVee"' /tmp/buyer
          grep -q '"episodes":2785' /tmp/buyer
          code=$(curl -sS -o /tmp/readiness -w '%{http_code}' --max-time 20 "$url/api/apex/readiness" || true)
          echo "readiness=$code"
          test "$code" = "200"
          grep -q '"apex-studio"' /tmp/readiness
          grep -q '"garden-of-apex"' /tmp/readiness
          grep -q '"kornknob"' /tmp/readiness
          echo "TeeVee_BUYER_READINESS_VERIFIED=1"
