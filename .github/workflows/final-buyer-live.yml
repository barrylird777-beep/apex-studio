name: Final Buyer Readiness Verification

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live Apexus buyer path
        run: |
          set -euo pipefail
          url=https://apex-studio-foundation-production.up.railway.app
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/health -w '%{http_code}' --max-time 10 "$url/health" || true)
            echo "health=$code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          test "$code" = "200"
          curl -fsSL --max-time 20 "$url/apexus-buyer.html" -o /tmp/page
          grep -qi "Apexus" /tmp/page
          curl -fsSL --max-time 20 "$url/api/apexus/buyer" -o /tmp/buyer
          grep -q '"product":"Apexus"' /tmp/buyer
          grep -q '"episodes":2785' /tmp/buyer
          curl -fsSL --max-time 20 "$url/api/apex/readiness" -o /tmp/readiness
          grep -q '"Apexus"' /tmp/readiness
          echo "APEXUS_BUYER_READINESS_VERIFIED=1"
