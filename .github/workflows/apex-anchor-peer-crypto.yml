name: APEX ANCHOR Peer Crypto
on:
  push:
    branches: ["apex-anchor-phase-1-monetization"]
    paths:
      - "public/apex-anchor-crypto.js"
      - "test/apex-anchor-crypto.test.mjs"
      - "public/apex-license-verify.js"
      - "test/apex-license-verify.test.mjs"
      - "edge/apex-signal-worker.mjs"
      - "edge/wrangler.toml"
      - "test/apex-signal-ticket.test.mjs"
      - ".github/workflows/apex-anchor-peer-crypto.yml"
  pull_request:
    paths:
      - "public/apex-anchor-crypto.js"
      - "test/apex-anchor-crypto.test.mjs"
      - "public/apex-license-verify.js"
      - "test/apex-license-verify.test.mjs"
      - "edge/apex-signal-worker.mjs"
      - "edge/wrangler.toml"
      - "test/apex-signal-ticket.test.mjs"
      - ".github/workflows/apex-anchor-peer-crypto.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  peer-crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: node --check edge/apex-signal-worker.mjs
      - run: node --test test/apex-anchor-crypto.test.mjs test/apex-license-verify.test.mjs test/apex-signal-ticket.test.mjs
