name: TLA+ Remote WAL Model Check

on:
  push:
    branches:
      - main
      - test/tla-remote-wal-model
    paths:
      - "spec/tla/**"
      - ".github/workflows/tla-model-check.yml"
  pull_request:
    paths:
      - "spec/tla/**"
      - ".github/workflows/tla-model-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download pinned TLA+ tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/zactionsz/tla-tools/releases/download/tla2tools-2026.08.11.125311/tla2tools.jar \
            --output "$RUNNER_TEMP/tla2tools.jar"
          echo "ab323b79802aedc3203b3f9af37c6aca3ed43f4e0225b36f2aa77b26de46c05f  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check

      - name: Run TLC safety model
        working-directory: spec/tla
        run: java -XX:+UseParallelGC -Xmx2g -jar "$RUNNER_TEMP/tla2tools.jar" -config RemoteWALIdempotency.cfg RemoteWALIdempotency.tla
