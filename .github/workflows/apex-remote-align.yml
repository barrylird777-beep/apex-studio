name: Apex Security Branch Alignment

on:
  push:
    branches:
      - security-hardening

permissions:
  contents: write

jobs:
  align:
    if: contains(github.event.head_commit.message, 'APEX-REMOTE-ALIGN')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security-hardening
        uses: actions/checkout@v6
        with:
          ref: security-hardening
          fetch-depth: 0

      - name: Merge main with ours strategy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main -X ours --no-commit

      - name: Regenerate lockfile
        run: npm install

      - name: Commit alignment
        run: |
          git add .
          git commit -m "chore(security): merge upstream main and resolve conflicts via ours strategy"
          git push origin HEAD:security-hardening
