name: Temporary Apex source export
on:
  push:
    branches:
      - apex/export-source-bridge
    paths:
      - .github/workflows/apex-source-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build source and history archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/apex-export
          git bundle create /tmp/apex-export/apex-studio-history.bundle --all
          git archive --format=tar.gz --output=/tmp/apex-export/apex-studio-source.tar.gz HEAD
          cd /tmp/apex-export
          sha256sum apex-studio-history.bundle apex-studio-source.tar.gz > SHA256SUMS
          ls -lh
      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: apex-studio-source-and-history
          path: /tmp/apex-export/*
          if-no-files-found: error
          retention-days: 3
