name: Apex Canonical CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apex-canonical-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sovereign-and-six-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
          with:
            persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test sovereign peer, WAL, and app fabric
        run: npm run sovereign:test

      - name: Test canonical six-app contract and routes
        run: npm run check:canonical

      - name: Build production app
        run: npm run build
