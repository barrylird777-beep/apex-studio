name: Apex Network Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/network/**"
      - "src/api/**"
      - "public/**"
      - "test/network-*.test.mjs"
      - "test/storage-stream.test.mjs"
      - "package.json"
      - ".github/workflows/apex-network-overnight-crew.yml"

concurrency:
  group: apex-network-verification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  network-verification:
    name: Read-only network verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run focused network tests
        run: npm run test:network
      - name: Verify source syntax
        run: |
          node --check src/network/path-selector.mjs
          node --check src/network/ipfs-swarm.mjs
      - name: State verification limits
        if: always()
        run: |
          echo "Read-only checks only. No AI agent, repository writes, issue edits, or direct commits."
          echo "This workflow does not prove live peer durability or physical-host replication."
