services:
  vllm:
    # Pin the engine API; update only alongside the APEX loader compatibility tests.
    image: vllm/vllm-openai:v0.10.2
    ipc: host
    ports:
      - "8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
    command:
      - --model
      - ${MODEL:?Set MODEL}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.92}
      - --max-model-len
      - ${MAX_MODEL_LEN:-32768}
      - --enable-prefix-caching
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
